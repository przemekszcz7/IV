<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Nieruchomości</title>
    <style>
        /* Your original site styles remain completely untouched */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .portfolio-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .offer-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 250px;
            background-color: #eee;
        }
        .main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumbnails {
            display: flex;
            gap: 5px;
            padding: 10px;
            background: #fff;
            overflow-x: auto;
        }
        .thumb-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 4px;
            border: 2px solid transparent;
            flex-shrink: 0;
        }
        .thumb-img:hover {
            border-color: #333;
        }
        .offer-details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .offer-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .offer-specs {
            margin: 0 0 15px 0;
            padding: 0;
            list-style: none;
            color: #666;
        }
        .offer-specs li {
            margin-bottom: 5px;
        }
        .price-info {
            margin-top: auto;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .price-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .price-line.total {
            font-weight: bold;
            color: #000;
            margin-top: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        
        <!-- THE UPDATED KLECINA OFFER CARD -->
        <div class="offer-card">
            <div class="image-container">
                <!-- Using the first image as the default active preview -->
                <img id="klecina-main" class="main-img" src="https://i.ibb.co/d0CF1zDD/638307959-122094941847283478-6191178085188639055-n.jpg" alt="Mieszkanie na Klecinie">
            </div>
            
            <!-- Dynamic Thumbnail Gallery within the card -->
            <div class="thumbnails">
                <img class="thumb-img" src="https://i.ibb.co/d0CF1zDD/638307959-122094941847283478-6191178085188639055-n.jpg" onclick="updatePreview('klecina-main', this.src)" alt="Miniaturka 1">
                <img class="thumb-img" src="https://i.ibb.co/k2ptQWgL/637292963-122094942177283478-3126443323052143984-n.jpg" onclick="updatePreview('klecina-main', this.src)" alt="Miniaturka 2">
                <img class="thumb-img" src="https://i.ibb.co/rfkZWhh2/638430448-122094941829283478-2801516253964915285-n.jpg" onclick="updatePreview('klecina-main', this.src)" alt="Miniaturka 3">
                <img class="thumb-img" src="https://i.ibb.co/mV0BBgr7/639566336-122094942117283478-8457010170034581875-n.jpg" onclick="updatePreview('klecina-main', this.src)" alt="Miniaturka 4">
                <img class="thumb-img" src="https://i.ibb.co/XxCRswhV/639060337-122094941931283478-8245118694726965152-n.jpg" onclick="updatePreview('klecina-main', this.src)" alt="Miniaturka 5">
                <img class="thumb-img" src="https://i.ibb.co/N6NkYhJc/639661991-122094941205283478-7206057152949917555-n.jpg" onclick="updatePreview('klecina-main', this.src)" alt="Miniaturka 6">
            </div>

            <div class="offer-details">
                <div class="offer-title">Do wynajęcia mieszkanie na Klecinie</div>
                
                <ul class="offer-specs">
                    <li>• 2 pokoje</li>
                    <li>• Taras</li>
                    <li>• Garderoba</li>
                </ul>

                <div class="price-info">
                    <div class="price-line">
                        <span>Czynsz najmu:</span>
                        <span>2500 zł</span>
                    </div>
                    <div class="price-line">
                        <span>Opłaty administracyjne:</span>
                        <span>ok. 1000 zł</span>
                    </div>
                    <div class="price-line total">
                        <span>Razem:</span>
                        <span>ok. 3500 zł</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Remaining original portfolio cards can continue here unchanged -->

    </div>

    <script>
        // Simple inline function to change target card image preview smoothly
        function updatePreview(targetId, newSrc) {
            document.getElementById(targetId).src = newSrc;
        }
    </script>
</body>
</html>
